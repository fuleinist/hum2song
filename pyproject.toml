[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hum2song"
version = "0.1.0"
description = "Hum a melody, get a song: audio -> pitch-tracked notes -> YuE2-native ABC -> song"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "fuleinist" }]
keywords = ["music", "abc-notation", "pitch-tracking", "yue2", "audio", "melody"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
# Transcription side only. Synthesis runs in a SEPARATE YuE2 environment (torch
# 2.10 / transformers 4.57 pins do not coexist with these); see hum2song/song.py.
dependencies = [
  "numpy>=1.26",
  "librosa>=0.10",
  "soundfile>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/fuleinist/hum2song"
YuE2 = "https://github.com/multimodal-art-projection/YuE"

[project.scripts]
hum2song = "hum2song.cli:main"

[tool.setuptools.packages.find]
include = ["hum2song*"]

[tool.pytest.ini_options]
testpaths = ["tests"]